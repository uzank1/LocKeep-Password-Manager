appId: com.lockeep.app
productName: LocKeepPasswordManager
copyright: Copyright © 2026 LocKeep
directories:
  output: dist
  buildResources: build
publish:
  provider: github
  owner: uzank1
  repo: LocKeep-Password-Manager
  releaseType: release
  channel: latest
files:
  - src/**/*
  - package.json
  - extension/**/*
  - "!tests/**/*"
  - "!scripts/**/*"
asarUnpack:
  - "extension/**"
win:
  target:
    - nsis
  icon: src/renderer/assets/icons/icon.ico
  artifactName: LocKeepPasswordManager-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: LocKeep
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  license: "build/license.txt"
mac:
  target: dmg
  icon: src/renderer/assets/icons/icon.ico
linux:
  target: AppImage
  icon: src/renderer/assets/icons/icon.ico
